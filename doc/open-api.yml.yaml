openapi: "3.0.2"
info:
  title: Basic SpringBoot API
  version: "1.0"
servers:
  - url: https://localhost:8080/api/v1
tags:
  - name: Person
    description: Person Details
  - name: Address
    description: Address Details
paths:
  /persons:
    get:
      tags:
        - Person
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
    post:
      tags:
        - Person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Person"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:

  /persons/{mail-id}:
    get:
      tags:
        - Person
      responses:
        '200':
          description: OK
  /persons/state/{mail-id}:
    get:
      tags:
        - Person
      responses:
        '200':
          description: OK
  /addresses/person/{mail-id}:
    post:
      tags:
        - Address
      responses:
        '200':
          description: OK
    delete:
      tags:
        - Address
      responses:
        '200':
          description: OK

components:
  schemas:
    Person:
      type: object
      properties:
        firstName:
          type: string
          example: Alok
          description: First Name
        lastName:
          type: string
          example: Meher
          description: Last Name
        mailId:
          type: string
          example: test@test.com
          description: Email Id of Person
        dateOfBirth:
          type: string
          example: 12-12-2024
          description: Date of Birth

